<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>LED sim</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}canvas{display:block;position:fixed;left:0;top:0}</style>
</head><body><canvas id="c"></canvas>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search);
var PITCH_MM=parseFloat(q.get('pitch_mm')||'0.234');
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0;
function resize(){
  var d=window.devicePixelRatio||1;
  cv.style.width=window.innerWidth+'px';cv.style.height=window.innerHeight+'px';
  W=cv.width=Math.round(window.innerWidth*d);H=cv.height=Math.round(window.innerHeight*d);
}
window.addEventListener('resize',resize);resize();

var FLASH_T=[1.0,2.5,3.2,5.5,6.0,8.5],FLASH_D=0.2,SYNC_LEN=12;
var AUTO=[['countdown',10],['sync1',SYNC_LEN],['board',40],['sync2',SYNC_LEN],['corners',10],['show',15],['end',0]];
window.__timeline=[];
function mark(ev){var e={event:ev,epoch_ms:Date.now()};window.__timeline.push(e);console.log(JSON.stringify(e));}

var mode='guide',modeStart=Date.now(),autoIdx=-1,showTL=false;
var board=new Image(),boardOK=false;
board.onload=function(){boardOK=true;};board.onerror=function(){boardOK=false;};
board.src='board.png?'+Date.now();
var video=document.createElement('video');video.muted=true;video.playsInline=true;video.preload='auto';
var clipOK=false;video.onloadeddata=function(){clipOK=true;};video.onerror=function(){clipOK=false;};
video.src='clip.mp4';
var SHOW_LEN=15;

var pending=null; // 次の描画フレームで適用する
function setMode(m,ev){pending={m:m,ev:ev};}
function applyMode(m,ev,now){
  mode=m;modeStart=now;
  mark(ev||('mode_'+m));
  if(m==='show'&&clipOK){video.currentTime=0;var p=video.play();if(p&&p.catch)p.catch(function(){});}
  else{try{video.pause();}catch(e){}}
}
function stopAll(ev){autoIdx=-1;setMode('black',ev||'stop');}
function startAuto(){autoIdx=0;setMode(AUTO[0][0],'auto_start:'+AUTO[0][0]);}

window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '||k==='Enter'){e.preventDefault();startAuto();}
  else if(k==='g'||k==='G'){autoIdx=-1;setMode('guide','manual_guide');}
  else if(k==='1'){autoIdx=-1;setMode('board','manual_board');}
  else if(k==='2'){autoIdx=-1;setMode('corners','manual_corners');}
  else if(k==='3'){autoIdx=-1;setMode('sync1','manual_sync');}
  else if(k==='4'){autoIdx=-1;setMode('show','manual_show');}
  else if(k==='0'){stopAll('manual_black');}
  else if(k==='r'||k==='R'){autoIdx=-1;setMode('ruler','manual_ruler');}
  else if(k==='f'||k==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){});}
  else if(k==='t'||k==='T'){showTL=!showTL;}
  else if(k==='Escape'){stopAll('esc');}
});

function txt(s,x,y,size,color,align){ctx.fillStyle=color;ctx.font=size+'px sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}

function drawCorners(){
  var t=8,a=160;ctx.fillStyle='#fff';
  ctx.fillRect(0,0,a,t);ctx.fillRect(0,0,t,a);
  ctx.fillRect(W-a,0,a,t);ctx.fillRect(W-t,0,t,a);
  ctx.fillRect(0,H-t,a,t);ctx.fillRect(0,H-a,t,a);
  ctx.fillRect(W-a,H-t,a,t);ctx.fillRect(W-t,H-a,t,a);
}
var GUIDE_LABELS=['左上','右上','右下','左下'],GUIDE_SEC=6;
function drawGuide(el){
  var cur=Math.floor(el/GUIDE_SEC)%4,t,a,i,x,y,sx,sy,thick;
  var cx=[0,W,W,0],cy=[0,0,H,H],dx=[1,-1,-1,1],dy=[1,1,-1,-1];
  for(i=0;i<4;i++){
    var on=(i===cur);
    t=on?28:6;a=on?360:140;ctx.fillStyle=on?'#fff':'#555';
    x=cx[i];y=cy[i];sx=dx[i];sy=dy[i];
    // L 字(画面の角ぴったり)
    ctx.fillRect(sx>0?x:x-a,sy>0?y:y-t,a,t);ctx.fillRect(sx>0?x:x-t,sy>0?y:y-a,t,a);ctx.fillRect(sx>0?x:x-a,sy>0?y:y-t,a,t);
    if(on){ // 脈打つ円
      var pulse=0.5+0.5*Math.sin(el*6);ctx.strokeStyle='rgba(255,60,60,'+(0.5+0.5*pulse)+')';ctx.lineWidth=10;
      ctx.beginPath();ctx.arc(x+sx*110,y+sy*110,70+pulse*20,0,7);ctx.stroke();
    }
    txt(String(i+1),x+sx*110,y+sy*110,on?90:50,on?'#ff4444':'#777');
  }
  txt('いま狙う: '+GUIDE_LABELS[cur]+' の角('+(cur+1)+'/4)',W/2,H*0.30,Math.round(H*0.10),'#fff');
  txt('iPhone「撮影記録」: まず「床を記録」。そのあと、光っている角に十字を合わせて「隅を記録」',W/2,H*0.50,Math.round(H*0.045),'#ccc');
  txt('順番: 1 左上 → 2 右上 → 3 右下 → 4 左下(6 秒ごとに光る角が変わります。自分のペースでかまいません)',W/2,H*0.60,Math.round(H*0.035),'#999');
  txt('終わったら「● 録画開始」→ このパソコンで Space(本番の流れが始まる)',W/2,H*0.75,Math.round(H*0.045),'#ccc');
}
function drawSync(el){
  for(var i=0;i<FLASH_T.length;i++){
    if(el>=FLASH_T[i]&&el<FLASH_T[i]+FLASH_D){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);return;}
  }
  txt(el.toFixed(2),20,H-30,28,'#444','left');
}
function drawRuler(){
  var pxcm=10/PITCH_MM,x,y,i,big;
  ctx.fillStyle='#fff';
  for(i=0,x=0;x<W;i++,x=i*pxcm){
    big=(i%10===0);
    ctx.fillRect(Math.round(x),0,1,big?80:40);ctx.fillRect(Math.round(x),H-(big?80:40),1,big?80:40);
    if(big&&i>0)txt(i+'cm',Math.round(x),100,20,'#fff');
  }
  for(i=0,y=0;y<H;i++,y=i*pxcm){
    big=(i%10===0);
    ctx.fillRect(0,Math.round(y),big?80:40,1);ctx.fillRect(W-(big?80:40),Math.round(y),big?80:40,1);
  }
  txt('pitch_mm='+PITCH_MM+'  '+W+'x'+H+'  1cm='+pxcm.toFixed(1)+'px',W/2,H/2,40,'#fff');
  ctx.strokeStyle='#fff';ctx.lineWidth=1;
  ctx.strokeRect(Math.round(W/2-pxcm*5)+0.5,H/2+60.5,Math.round(pxcm*10),Math.round(pxcm*10));
  txt('10cm',W/2,H/2+60+pxcm*10+24,24,'#fff');
}
function drawBars(el){
  var cols=['#fff','#ff0','#0ff','#0f0','#f0f','#f00','#00f','#888'],n=cols.length,bw=W/n,off=(el*W/5)%W;
  for(var i=0;i<n;i++){
    ctx.fillStyle=cols[i];
    ctx.fillRect(Math.round(i*bw-off),0,Math.ceil(bw)+1,H);
    ctx.fillRect(Math.round(i*bw-off+W),0,Math.ceil(bw)+1,H);
  }
  txt(el.toFixed(2),20,H-30,28,'#000','left');
}
function drawShow(el){
  if(!clipOK){drawBars(el);return;}
  var vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return;
  var s=Math.min(W/vw,H/vh),dw=vw*s,dh=vh*s;
  ctx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);
}
function showLen(){return (clipOK&&video.duration)?video.duration:SHOW_LEN;}

function frame(){
  var now=Date.now(),el;
  if(pending){var p=pending;pending=null;applyMode(p.m,p.ev,now);}
  if(autoIdx>=0&&autoIdx<AUTO.length-1&&now-modeStart>=AUTO[autoIdx][1]*1000){
    autoIdx++;applyMode(AUTO[autoIdx][0],'auto:'+AUTO[autoIdx][0],now);
  }
  el=(now-modeStart)/1000;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(showTL){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    var lines=JSON.stringify(window.__timeline,null,1).split('\n');
    for(var i=0;i<lines.length&&i<45;i++)txt(lines[i],40,30+i*26,22,'#0f0','left');
  }else if(mode==='board'){
    if(boardOK)ctx.drawImage(board,0,0);
    else txt('board.png が無い',W/2,H/2,48,'#888');
  }else if(mode==='guide')drawGuide(el);
  else if(mode==='corners')drawCorners();
  else if(mode==='sync1'||mode==='sync2'){
    if(autoIdx<0&&el>=SYNC_LEN){mode='black';mark('manual_sync_end');}
    else drawSync(el);
  }else if(mode==='show'){
    if(autoIdx<0&&el>=showLen()){mode='black';mark('manual_show_end');try{video.pause();}catch(e){}}
    else drawShow(el);
  }else if(mode==='ruler')drawRuler();
  else if(mode==='countdown')txt(String(Math.max(1,Math.ceil(10-el))),W/2,H/2,Math.round(H*0.5),'#444');
  else if(mode==='end')txt('おわり',W/2,H/2,40,'#666');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script></body></html>
