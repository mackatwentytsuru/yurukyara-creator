<!doctype html>
<meta charset="utf-8">
<title>33 点の校正(モニター)</title>
<style>html,body{margin:0;background:#000;overflow:hidden;cursor:none}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c" width="5120" height="1440"></canvas>
<script>
// LED の点の校正の映像(make_led_dots_video.py)を、5120×1440 のモニターに縮めて映す試し。1 周 11.4 秒: 全体を緑 0.4 秒 → 0.4 秒消す → 33 点を 0.3 秒おき → 0.7 秒あける。緑の明るさは周ごとに LEVELS。
const T = [{"k": 0, "px": 95.6, "py": 186.0, "rx": 62.5, "ry": 62.5}, {"k": 1, "px": 478.0, "py": 186.0, "rx": 62.5, "ry": 62.5}, {"k": 2, "px": 860.4, "py": 186.0, "rx": 62.5, "ry": 62.5}, {"k": 3, "px": 95.6, "py": 620.0, "rx": 62.5, "ry": 62.5}, {"k": 4, "px": 478.0, "py": 620.0, "rx": 62.5, "ry": 62.5}, {"k": 5, "px": 860.4, "py": 620.0, "rx": 62.5, "ry": 62.5}, {"k": 6, "px": 95.6, "py": 1054.0, "rx": 62.5, "ry": 62.5}, {"k": 7, "px": 478.0, "py": 1054.0, "rx": 62.5, "ry": 62.5}, {"k": 8, "px": 860.4, "py": 1054.0, "rx": 62.5, "ry": 62.5}, {"k": 9, "px": 1455.9, "py": 254.95, "rx": 84.8, "ry": 57.1}, {"k": 10, "px": 1807.7, "py": 254.95, "rx": 84.8, "ry": 57.1}, {"k": 11, "px": 2159.5, "py": 254.95, "rx": 84.8, "ry": 57.1}, {"k": 12, "px": 2511.3, "py": 254.95, "rx": 84.8, "ry": 57.1}, {"k": 13, "px": 2863.1, "py": 254.95, "rx": 84.8, "ry": 57.1}, {"k": 14, "px": 1455.9, "py": 651.5, "rx": 84.8, "ry": 57.1}, {"k": 15, "px": 1807.7, "py": 651.5, "rx": 84.8, "ry": 57.1}, {"k": 16, "px": 2159.5, "py": 651.5, "rx": 84.8, "ry": 57.1}, {"k": 17, "px": 2511.3, "py": 651.5, "rx": 84.8, "ry": 57.1}, {"k": 18, "px": 2863.1, "py": 651.5, "rx": 84.8, "ry": 57.1}, {"k": 19, "px": 1455.9, "py": 1048.05, "rx": 84.8, "ry": 57.1}, {"k": 20, "px": 1807.7, "py": 1048.05, "rx": 84.8, "ry": 57.1}, {"k": 21, "px": 2159.5, "py": 1048.05, "rx": 84.8, "ry": 57.1}, {"k": 22, "px": 2511.3, "py": 1048.05, "rx": 84.8, "ry": 57.1}, {"k": 23, "px": 2863.1, "py": 1048.05, "rx": 84.8, "ry": 57.1}, {"k": 24, "px": 3440.3, "py": 186.0, "rx": 62.5, "ry": 62.5}, {"k": 25, "px": 3817.5, "py": 186.0, "rx": 62.5, "ry": 62.5}, {"k": 26, "px": 4194.7, "py": 186.0, "rx": 62.5, "ry": 62.5}, {"k": 27, "px": 3440.3, "py": 620.0, "rx": 62.5, "ry": 62.5}, {"k": 28, "px": 3817.5, "py": 620.0, "rx": 62.5, "ry": 62.5}, {"k": 29, "px": 4194.7, "py": 620.0, "rx": 62.5, "ry": 62.5}, {"k": 30, "px": 3440.3, "py": 1054.0, "rx": 62.5, "ry": 62.5}, {"k": 31, "px": 3817.5, "py": 1054.0, "rx": 62.5, "ry": 62.5}, {"k": 32, "px": 4194.7, "py": 1054.0, "rx": 62.5, "ry": 62.5}];
const SYNC = 400.0, GAP = 400.0, STEP = 300.0, ON = 200.0, TAIL = 700.0;
const LEVELS = [1.0, 0.6, 0.35];
const S = 5120 / 5680, Y0 = 161;
// 点は LED で直径 50 cm だが、モニターの距離(約 1 m)に合わせて小さくする(画面の点の大きさを会場の見え方に近づける)
const DOT_SCALE = Number(new URLSearchParams(location.search).get('dot') ?? 0.5);
const CYCLE = SYNC + GAP + T.length * STEP + TAIL;
const g = document.getElementById('c').getContext('2d');
let last = '';
function frame() {
  const now = performance.now();
  const n = Math.floor(now / CYCLE), t = now % CYCLE;
  const lv = LEVELS[n % LEVELS.length];
  const col = `rgb(0,${Math.round(255 * lv)},0)`;
  let key = 'off', k = -1;
  if (t < SYNC) key = 'sync' + lv;
  else if (t >= SYNC + GAP) { const q = t - SYNC - GAP, i = Math.floor(q / STEP); if (i < T.length && q - i * STEP < ON) { key = 'dot' + i + lv; k = i; } }
  if (key !== last) {
    last = key;
    g.fillStyle = '#000'; g.fillRect(0, 0, 5120, 1440);
    g.fillStyle = col;
    if (key.startsWith('sync')) g.fillRect(0, Y0, 5120, 1240 * S);
    else if (k >= 0) { const d = T[k]; g.beginPath(); g.ellipse(d.px * S, Y0 + d.py * S, d.rx * S * DOT_SCALE, d.ry * S * DOT_SCALE, 0, 0, 2 * Math.PI); g.fill(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
