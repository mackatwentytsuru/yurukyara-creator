name: RoomScan
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
targets:
  RoomScan:
    type: application
    platform: iOS
    sources: [RoomScan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.user.hackathon.roomscan
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: 場所スキャン
        INFOPLIST_KEY_NSCameraUsageDescription: 部屋の形と家具の名前を測って、3D にするためです。映像は保存しません。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  RoomScan:
    build:
      targets:
        RoomScan: all
