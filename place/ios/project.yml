name: RoomScan
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
targets:
  RoomScan:
    type: application
    platform: iOS
    sources: [RoomScan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.user.hackathon.roomscan
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: 場所スキャン
        INFOPLIST_KEY_NSCameraUsageDescription: 部屋の形と家具の名前を測って、3D にするためです。映像は保存しません。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  ARStage:
    type: application
    platform: iOS
    sources: [ARStage]
    info:
      path: ARStage/Info.plist
      properties:
        ARStageURL: $(ARSTAGE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.user.hackathon.arstage
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        ARSTAGE_URL: ''
        INFOPLIST_KEY_CFBundleDisplayName: ARステージ
        INFOPLIST_KEY_NSCameraUsageDescription: 現実の景色にキャラを重ねるためです。映像は保存しません。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: キャラと声で話すためです。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 開発中の PC のページを開くためです。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  ShootLog:
    type: application
    platform: iOS
    sources:
      - ShootLog
      - path: ue_link_defaults.json
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hackathon.shootlog
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: 撮影記録
        INFOPLIST_KEY_NSCameraUsageDescription: 動画を撮りながら、カメラの位置と向きを記録するためです。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 作業用 PC の UE へ位置を送り、UE の絵を受けるためです。
        INFOPLIST_KEY_UIStatusBarHidden: YES
  CamProbe:
    type: application
    platform: iOS
    sources: [CamProbe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hackathon.camprobe
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: カメラ探り
        INFOPLIST_KEY_NSCameraUsageDescription: 背面カメラを同時に動かせる組み合わせを測るためです。映像は保存しません。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeRight
schemes:
  RoomScan:
    build:
      targets:
        RoomScan: all
  ARStage:
    build:
      targets:
        ARStage: all
  ShootLog:
    build:
      targets:
        ShootLog: all
  CamProbe:
    build:
      targets:
        CamProbe: all
