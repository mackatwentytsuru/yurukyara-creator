<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>スマホの確認</title>
  <link rel="stylesheet" href="/kiosk/kiosk.css" />
  <style>
    body { overflow: auto; }
    main { max-width: 720px; margin: 0 auto; padding: 14px 16px 60px; display: grid; gap: 14px; }
    section { background: var(--ink-2); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
    h2 { margin: 0; font-size: 17px; }
    button, select { font: inherit; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: #0c1826; color: var(--text); }
    button.go { background: var(--teal); color: var(--ink); font-weight: 700; border: 0; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; color: #cfe; }
    video { width: 100%; max-height: 40vh; background: #000; border-radius: 10px; object-fit: contain; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .meter { height: 12px; border-radius: 6px; background: #0c1826; overflow: hidden; flex: 1; min-width: 80px; }
    .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--pink)); }
  </style>
</head>
<body>
  <main>
    <h1>スマホの確認(カメラ・マイク・スピーカー・画面ロック)</h1>
    <section><h2>0. この端末</h2><pre id="env">…</pre></section>
    <section>
      <h2>1. カメラ(超広角が選べるか)</h2>
      <div class="row"><button class="go" id="camList">カメラの一覧を出す</button><select id="camSel"></select><button id="camStart">このカメラで映す</button></div>
      <video id="vid" playsinline muted></video>
      <pre id="camOut">―</pre>
    </section>
    <section>
      <h2>2. マイク(USB のステレオマイクが 2ch で取れるか)</h2>
      <div class="row"><button class="go" id="micList">マイクの一覧を出す</button><select id="micSel"></select><button id="micStart">2ch で聞く</button></div>
      <div class="row">左<div class="meter"><i id="mL"></i></div>右<div class="meter"><i id="mR"></i></div></div>
      <pre id="micOut">―</pre>
    </section>
    <section>
      <h2>3. スピーカーと遅れ(スマホの音が店で聞こえるか・往復の遅れ)</h2>
      <div class="row"><button class="go" id="tone">音量いっぱいでノイズを 3 秒</button><button id="beep">ビープ→マイクで往復の遅れ(2 の「2ch で聞く」の後)</button></div>
      <pre id="spkOut">―</pre>
    </section>
    <section>
      <h2>4. 画面ロックと復帰</h2>
      <div class="row"><button class="go" id="wake">画面を消さない(Wake Lock)</button></div>
      <pre id="wakeOut">―</pre>
    </section>
    <p class="hint">音も映像も、この画面の中で数字にするだけです。保存も送信もしません。</p>
  </main>
  <script type="module" src="/kiosk/phone.js"></script>
</body>
</html>
