<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>顔の検出の速さ</title>
  <link rel="stylesheet" href="/kiosk/kiosk.css" />
  <style>
    body { overflow: auto; }
    main { max-width: 720px; margin: 0 auto; padding: 14px 16px 60px; display: grid; gap: 12px; }
    button, select, input { font: inherit; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: var(--ink-2); color: var(--text); }
    button.go { background: var(--teal); color: var(--ink); font-weight: 700; border: 0; }
    video { width: 100%; max-height: 36vh; background: #000; border-radius: 10px; object-fit: contain; }
    pre { margin: 0; white-space: pre-wrap; font-size: 13px; line-height: 1.55; color: #cfe; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <main>
    <h1>顔の検出の速さ(ミニ PC・スマホで、同じ動画を使って比べる)</h1>
    <p class="note">自宅のテストで撮った動画(iPhone/Pixel)を選ぶと、30 秒、顔の検出を 1 コマずつ実行して、1 コマあたりの時間・見つかった割合を出します。カメラを選ぶと、その端末のカメラで同じ測定をします。映像は、この画面の中だけで使い、保存・送信しません。</p>
    <div class="row">
      <input type="file" id="file" accept="video/*" />
      <button id="cam">この端末のカメラで測る</button>
      <select id="delegate"><option>GPU</option><option>CPU</option></select>
      <button class="go" id="run">測る(30 秒)</button>
    </div>
    <video id="vid" playsinline muted loop></video>
    <pre id="out">―</pre>
  </main>
  <script type="module" src="/kiosk/fps.js"></script>
</body>
</html>
