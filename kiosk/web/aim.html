<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>視線の校正(向きを合わせる)</title>
  <style>
    :root { --bg: #0d1b2a; --fg: #eaf3f5; --teal: #38d6c4; --muted: #8fa9b3; --warn: #ffd27a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
    main { max-width: 480px; margin: 0 auto; padding: 14px; display: grid; gap: 12px; }
    h1 { font-size: 18px; margin: 0; }
    .now { font-size: 30px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
    .now small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button { font: inherit; font-size: 20px; padding: 16px 0; border-radius: 14px; border: 0; background: #1f3448; color: var(--fg); touch-action: manipulation; }
    button:active { background: #2a4a63; }
    .rec { background: var(--teal); color: #032; font-weight: 800; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .step { display: flex; gap: 8px; justify-content: center; font-size: 14px; color: var(--muted); }
    .step label { display: flex; gap: 4px; align-items: center; }
    #msg { min-height: 1.6em; text-align: center; color: var(--warn); font-size: 15px; }
    ol { margin: 0; padding-left: 1.4em; font-size: 13px; color: var(--muted); line-height: 1.6; }
    a { color: var(--teal); }
  </style>
</head>
<body>
  <main>
    <h1>視線の校正: 見本のキャラの向きを合わせる</h1>
    <ol>
      <li>床の印に立つ(距離 1.5〜3 m・左右。5〜6 か所)</li>
      <li>矢印で、見本のキャラが「自分を見ている」と感じる向きにする</li>
      <li>「この向きで記録」(カメラの顔の位置と、いまの向きが 1 点になる)</li>
      <li>全部の点が済んだら「点を保存」→ <code>gaze_calib.py --points</code></li>
    </ol>
    <div class="now"><span id="az">—</span>° / <span id="el">—</span>°<small>左右(客から見て右が +)/ 上下(上が +)・記録 <span id="count">0</span> 点</small></div>
    <div class="step">
      <label><input type="radio" name="step" value="0.5" />0.5°</label>
      <label><input type="radio" name="step" value="1" checked />1°</label>
      <label><input type="radio" name="step" value="3" />3°</label>
    </div>
    <div class="pad">
      <span></span><button type="button" data-d="0,1" aria-label="上へ">↑</button><span></span>
      <button type="button" data-d="-1,0" aria-label="左へ">←</button>
      <button type="button" id="fromCam" title="いまのカメラの向きから始める">カメラ</button>
      <button type="button" data-d="1,0" aria-label="右へ">→</button>
      <span></span><button type="button" data-d="0,-1" aria-label="下へ">↓</button><span></span>
    </div>
    <button type="button" class="rec" id="mark">この向きで記録</button>
    <div class="row">
      <button type="button" id="undo">1 点 取り消し</button>
      <button type="button" id="off">カメラに戻す</button>
      <button type="button" id="save">点を保存</button>
    </div>
    <p id="msg" role="status"></p>
  </main>
  <script type="module" src="/kiosk/aim.js"></script>
</body>
</html>
