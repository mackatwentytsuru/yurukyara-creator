<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>入口の案内見本のキャラ</title>
  <link rel="stylesheet" href="/kiosk/kiosk.css" />
</head>
<body>
  <main class="stage" id="stage" data-mode="attract">
    <header class="top">
      <div class="who">
        <span class="avatar" id="avatar" aria-hidden="true">ビ</span>
        <div>
          <h1 id="venue">入口の案内</h1>
          <p class="sub">案内役見本のキャラ</p>
        </div>
      </div>
      <div class="badges">
        <span class="badge" id="memBadge" hidden></span>
        <span class="badge badge-brain" id="brainBadge">接続中…</span>
      </div>
    </header>

    <section class="attract" id="attract" aria-live="polite">
      <p class="hello">こんにちは。<br />お店のこと、なんでも聞いてくださいね。</p>
      <button class="start" id="start" type="button">話しかける</button>
      <p class="hint">営業時間・料金・行き方・ショーのこと など</p>
    </section>

    <section class="talk" id="talk" aria-label="会話">
      <ol class="log" id="log" aria-live="polite"></ol>
      <div class="chips" id="chips" aria-label="よくある質問"></div>
    </section>

    <form class="compose" id="compose" autocomplete="off">
      <button class="mic" id="mic" type="button" disabled title="声での質問は使えません(文字だけ)" aria-label="声で話す(未接続)">声</button>
      <input class="field" id="field" type="text" maxlength="200" placeholder="ここに入力して、送るを押してください" aria-label="質問" />
      <button class="send" id="send" type="submit">送る</button>
      <button class="staff" id="staff" type="button">スタッフを呼ぶ</button>
    </form>
    <p class="toast" id="toast" role="status" hidden></p>
  </main>
  <script type="module" src="/kiosk/io.js"></script>
  <script type="module" src="/kiosk/kiosk.js"></script>
</body>
</html>
