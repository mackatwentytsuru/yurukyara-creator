<!doctype html>
<html lang="ja" class="gate-up">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14121f" />
  <title>ゆるキャラクリエイター</title>
  <!-- 初めての会話(S4)が、見本に近い子がいない時に 1 回で開く「PC の Claude Code で新しい子を作る」手順(README の節) -->
  <link rel="help" href="https://github.com/mackatwentytsuru/yurukyara-creator#make-your-own-character-on-your-pc-with-claude-code" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="stage" aria-label="話すキャラクター"></canvas>

  <header class="top">
    <div class="chips" id="chips" aria-live="polite"></div>
    <div class="top-row">
      <div class="modes" id="modes"></div>
      <details class="drawer" id="memoryDrawer" hidden>
        <summary>覚えていること</summary>
        <div class="drawer-body" id="memorySlot"></div>
      </details>
      <div class="look-switch" id="lookSwitch" role="group" aria-label="見た目の切り替え(3D と 2D)" data-hide-in-ar hidden>
        <span class="look-label" aria-hidden="true">見た目</span>
        <button type="button" data-look="3d" aria-pressed="true" aria-label="3D(立体)で見る" title="3D(立体)で見る">3D</button>
        <button type="button" data-look="2d" aria-pressed="false" aria-label="2D(絵)で見る" title="2D(絵)で見る">2D</button>
      </div>
    </div>
  </header>

  <p id="align" class="align" role="status" hidden></p>

  <div class="subs">
    <p id="brainNotice" class="brain-notice" role="status" hidden></p>
    <p id="uiNotice" class="ui-notice" role="status" hidden></p>
    <p id="shopBadge" class="shop-badge" role="status" hidden></p>
    <section id="caption" class="caption" aria-live="polite" hidden></section>
  </div>

  <aside id="thought" class="thought" aria-label="Claude の考え">
    <button class="thought-head" id="thoughtToggle" type="button" aria-expanded="true">
      <span class="dot"></span>Claude の考え
    </button>
    <dl class="thought-body" id="thoughtBody">
      <div class="row"><dt>見えた様子</dt><dd id="tSeen">—</dd></div>
      <div class="row"><dt>用件</dt><dd id="tIntent">—</dd></div>
      <div class="row" id="tShopRow" hidden><dt>店のデータ</dt><dd id="tShop">—</dd></div>
      <div class="row"><dt>返事</dt><dd id="tReply">—</dd></div>
      <div class="row"><dt>表情と動き</dt><dd id="tAct">—</dd></div>
    </dl>
    <footer class="thought-foot" id="tFoot"></footer>
  </aside>

  <footer class="bottom">
    <p class="privacy" id="privacy" role="note">
      <span class="rec"></span>
      <span id="privacyText">カメラの映像は、この端末の中で人の位置を調べるだけに使います。保存も、送信もしません。</span>
    </p>
    <div id="choices" class="choices" role="group" aria-label="よくある質問" hidden></div>
    <form id="composer" class="composer" autocomplete="off">
      <button type="button" id="micBtn" class="mic" aria-pressed="false" title="声で話す">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
        <span id="micLabel">声で話す</span>
      </button>
      <input id="textInput" type="text" placeholder="文字で話しかける" enterkeyhint="send" />
      <button type="submit" class="send">送る</button>
    </form>
  </footer>

  <!-- 入口。閉じるまで、上の段(html.gate-up の間は隠す)は押せない。初めての訪問なら、閉じた後に「はじめての会話」(7 歩)が出る -->
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="gate-card">
      <h1 id="gateTitle">ゆるキャラクリエイター</h1>
      <p class="gate-guide" id="gateGuide">案内するのは主役の<b>ノリー</b>。協力者が手で描いた、セスジキノボリカンガルーの執事見習いです。</p>
      <p class="lead" id="gateLead">キャラがあなたの方を見て、文字で答えます。声は、声の鍵があるときだけ出ます。</p>
      <p class="gate-first" id="gateFirst" hidden>はじめてなら、このあと「はじめての会話」(7 歩)が始まります。キャラ作りの流れを試せます。</p>
      <button id="startCam" class="primary" type="button"><span class="btn-main">カメラを使って始める</span><small class="btn-sub" id="camSub">キャラがあなたの方を見ます</small></button>
      <button id="startSim" class="ghost" type="button"><span class="btn-main">カメラなしで試す</span><small class="btn-sub" id="simSub">画面の上で動かした向きを見ます</small></button>
      <label class="pass" id="passField" hidden>
        <span>合言葉(あれば。無くても仮の頭脳で話せます)</span>
        <input id="passInput" type="password" autocomplete="off" maxlength="200" />
      </label>
      <p class="fine" id="gateFine">カメラの映像は端末の外に出ません。人の位置を調べるだけで、保存もしません。マイクは「声で話す」を押した時だけ使います。</p>
      <p class="status" id="gateStatus" aria-live="polite"></p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
