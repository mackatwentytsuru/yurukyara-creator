<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リアルタイムの絵</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #status { position: fixed; left: 8px; top: 8px; color: #fff; font: 14px/1.4 sans-serif;
            background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px; white-space: pre; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="status">つないでいます…</div>
<script>
// 印の場所は live_camera.py の MARKER_CENTER と同じ
const MARKER = { x: 0.05, y: 0.90 };
const CLOCK_SAMPLES = 10;
const params = new URLSearchParams(location.search);
const shotTimes = (params.get('shots') || '').split(',').filter(Boolean).map(Number);
const video = document.getElementById('video');
const statusBox = document.getElementById('status');
const probe = document.createElement('canvas');
probe.width = probe.height = 1;
const probeContext = probe.getContext('2d', { willReadFrequently: true });
const log = { events: [], frames: 0, stats: [], clockOffsetMs: 0, size: null, ua: navigator.userAgent };
const clockSamples = [];
let socket, peer, lastCode = null, windowFrames = 0, windowStart = performance.now();

const send = (message) => socket.send(JSON.stringify(message));
const wallNow = (t) => performance.timeOrigin + t + log.clockOffsetMs;

function decodeMarker() {
  const sx = video.videoWidth * MARKER.x, sy = video.videoHeight * MARKER.y;
  probeContext.drawImage(video, sx - 2, sy - 2, 4, 4, 0, 0, 1, 1);
  const [r, g, b] = probeContext.getImageData(0, 0, 1, 1).data;
  const bit = (v) => (v > 110 ? 1 : 0);
  log.lastRgb = [r, g, b];
  return bit(r) + 2 * bit(g) + 4 * bit(b);
}

function onFrame(now, meta) {
  log.frames += 1;
  windowFrames += 1;
  log.size = [video.videoWidth, video.videoHeight];
  const code = decodeMarker();
  if (code !== lastCode) {
    lastCode = code;
    log.events.push({ code, wall_ms: wallNow(now), display_ms: wallNow(meta.expectedDisplayTime) });
  }
  if (now - windowStart > 1000) {
    const fps = windowFrames * 1000 / (now - windowStart);
    windowFrames = 0;
    windowStart = now;
    statusBox.textContent = `${video.videoWidth}x${video.videoHeight}  ${fps.toFixed(1)} fps`;
  }
  video.requestVideoFrameCallback(onFrame);
}

function sendShot(at) {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  send({ type: 'liveFrame', at, jpeg: canvas.toDataURL('image/jpeg', 0.9) });
}

async function collectStats() {
  const report = await peer.getStats();
  report.forEach((s) => {
    if (s.type === 'inbound-rtp' && s.kind === 'video') {
      log.stats.push({ wall_ms: wallNow(performance.now()), received: s.framesReceived, decoded: s.framesDecoded,
        dropped: s.framesDropped, lost: s.packetsLost, bytes: s.bytesReceived, decoder: s.decoderImplementation,
        jitterDelay: s.jitterBufferDelay, jitterCount: s.jitterBufferEmittedCount, freezes: s.freezeCount });
    }
    if (s.type === 'codec' && s.mimeType && s.mimeType.startsWith('video')) {
      log.codec = s.mimeType + ' ' + (s.sdpFmtpLine || '');
    }
  });
}

function onClockReply(message) {
  const received = performance.now();
  clockSamples.push({ rtt: received - message.sent,
    offset: message.ms - (performance.timeOrigin + (message.sent + received) / 2) });
  if (clockSamples.length < CLOCK_SAMPLES) {
    send({ type: 'timeReq', sent: performance.now() });
    return;
  }
  clockSamples.sort((a, b) => a.rtt - b.rtt);
  log.clockOffsetMs = clockSamples[0].offset;
  log.clockRttMs = clockSamples[0].rtt;
  send({ type: 'listStreamers' });
}

async function onOffer(message) {
  peer = new RTCPeerConnection({ iceServers: [] });
  peer.onicecandidate = (e) => { if (e.candidate) send({ type: 'iceCandidate', candidate: e.candidate }); };
  peer.ontrack = (e) => {
    if (e.track.kind !== 'video') return;
    video.srcObject = e.streams[0] || new MediaStream([e.track]);
    video.play().catch(() => {});
  };
  peer.onconnectionstatechange = () => {
    log.state = peer.connectionState;
    statusBox.textContent = '接続: ' + peer.connectionState;
  };
  await peer.setRemoteDescription({ type: 'offer', sdp: message.sdp });
  const answer = await peer.createAnswer();
  await peer.setLocalDescription(answer);
  send({ type: 'answer', sdp: answer.sdp });
  video.requestVideoFrameCallback(onFrame);
  setInterval(collectStats, 1000);
  setInterval(() => send({ type: 'liveLog', data: log }), 2000);
  for (const at of shotTimes) setTimeout(() => sendShot(at), at * 1000);
}

socket = new WebSocket(`ws://${location.host}/`);
socket.onmessage = async (event) => {
  const message = JSON.parse(event.data);
  if (message.type === 'config') {
    send({ type: 'timeReq', sent: performance.now() });
  } else if (message.type === 'timeRes') {
    onClockReply(message);
  } else if (message.type === 'streamerList') {
    if (message.ids.length) {
      send({ type: 'subscribe', streamerId: message.ids[0] });
    } else {
      statusBox.textContent = 'UE を待っています…';
      setTimeout(() => send({ type: 'listStreamers' }), 1000);
    }
  } else if (message.type === 'offer') {
    await onOffer(message);
  } else if (message.type === 'iceCandidate' && peer) {
    (log.remoteCandidates = log.remoteCandidates || []).push(message.candidate.candidate);
    await peer.addIceCandidate(message.candidate);
  }
};
socket.onclose = () => { statusBox.textContent = '切れました。開き直してください'; };
</script>
</body>
</html>
