<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif">
  <title>ことのは駅まわりの地図(架空)</title>
  <rect width="1200" height="800" fill="#f6f1e4"/>

  <!-- 道 -->
  <g fill="#ffffff" stroke="#cfc6ad" stroke-width="3">
    <rect x="0" y="560" width="1200" height="44"/>
    <rect x="860" y="190" width="44" height="370"/>
    <rect x="296" y="190" width="44" height="370"/>
    <rect x="296" y="146" width="608" height="44"/>
  </g>

  <!-- 線路 -->
  <rect x="0" y="388" width="1200" height="24" fill="#6b6b6b"/>
  <g stroke="#9a9a9a" stroke-width="6">
    <line x1="20" y1="380" x2="20" y2="420"/><line x1="70" y1="380" x2="70" y2="420"/><line x1="120" y1="380" x2="120" y2="420"/><line x1="170" y1="380" x2="170" y2="420"/><line x1="220" y1="380" x2="220" y2="420"/><line x1="270" y1="380" x2="270" y2="420"/><line x1="320" y1="380" x2="320" y2="420"/><line x1="370" y1="380" x2="370" y2="420"/>
    <line x1="830" y1="380" x2="830" y2="420"/><line x1="880" y1="380" x2="880" y2="420"/><line x1="930" y1="380" x2="930" y2="420"/><line x1="980" y1="380" x2="980" y2="420"/><line x1="1030" y1="380" x2="1030" y2="420"/><line x1="1080" y1="380" x2="1080" y2="420"/><line x1="1130" y1="380" x2="1130" y2="420"/><line x1="1180" y1="380" x2="1180" y2="420"/>
  </g>

  <!-- 駅 -->
  <rect x="400" y="350" width="400" height="100" rx="10" fill="#d9573f" stroke="#8c2f1f" stroke-width="4"/>
  <text x="600" y="412" font-size="42" font-weight="700" fill="#fff" text-anchor="middle">ことのは駅</text>

  <!-- 北口 -->
  <rect x="560" y="336" width="80" height="22" rx="4" fill="#fff" stroke="#8c2f1f" stroke-width="3"/>
  <text x="680" y="352" font-size="30" font-weight="700" fill="#8c2f1f" text-anchor="start">北口</text>
  <!-- 南口 -->
  <rect x="560" y="442" width="80" height="22" rx="4" fill="#fff" stroke="#8c2f1f" stroke-width="3"/>
  <text x="680" y="466" font-size="30" font-weight="700" fill="#8c2f1f" text-anchor="start">南口</text>

  <!-- 北口広場 -->
  <rect x="420" y="190" width="360" height="136" rx="14" fill="#e8f0d8" stroke="#8aa35b" stroke-width="3"/>
  <text x="600" y="312" font-size="26" fill="#4d6b24" text-anchor="middle">北口広場</text>

  <!-- ことのは案内所(広場の北東) -->
  <rect x="660" y="208" width="104" height="60" rx="8" fill="#3b82c4" stroke="#1d4f82" stroke-width="3"/>
  <text x="712" y="233" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">ことのは</text>
  <text x="712" y="258" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">案内所</text>

  <!-- 1番のりば(広場の西側) -->
  <circle cx="448" cy="250" r="24" fill="#f2b632" stroke="#9a6d00" stroke-width="3"/>
  <text x="448" y="260" font-size="28" font-weight="700" fill="#3a2a00" text-anchor="middle">1</text>
  <text x="318" y="110" font-size="22" font-weight="700" fill="#5a4300" text-anchor="middle">1番のりば:</text>
  <text x="318" y="136" font-size="22" font-weight="700" fill="#5a4300" text-anchor="middle">海べ公園行き</text>
  <path d="M424 250 L318 250 L318 150" fill="none" stroke="#f2b632" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- 2番のりば(広場の東側) -->
  <circle cx="806" cy="250" r="24" fill="#f2b632" stroke="#9a6d00" stroke-width="3"/>
  <text x="806" y="260" font-size="28" font-weight="700" fill="#3a2a00" text-anchor="middle">2</text>
  <text x="1010" y="232" font-size="22" font-weight="700" fill="#5a4300" text-anchor="middle">2番のりば:役場前行き</text>
  <text x="1010" y="258" font-size="22" font-weight="700" fill="#5a4300" text-anchor="middle">(最終バスはここ)</text>

  <!-- ことのは通り(朝市) -->
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#a33"/></marker></defs>
  <rect x="570" y="40" width="60" height="150" fill="#ffffff" stroke="#cfc6ad" stroke-width="3"/>
  <g stroke="#a33" stroke-width="2">
    <rect x="534" y="58" width="30" height="22" fill="#f08a5d"/><rect x="636" y="58" width="30" height="22" fill="#6cc3a0"/>
    <rect x="534" y="94" width="30" height="22" fill="#f6d55c"/><rect x="636" y="94" width="30" height="22" fill="#ed6a8a"/>
    <rect x="534" y="130" width="30" height="22" fill="#6cc3a0"/><rect x="636" y="130" width="30" height="22" fill="#f08a5d"/>
  </g>
  <text x="600" y="30" font-size="26" font-weight="700" fill="#a33" text-anchor="middle">ことのは通り(日曜の朝市)</text>
  <path d="M600 186 L600 96" stroke="#a33" stroke-width="5" marker-end="url(#arr)"/>
  <text x="684" y="176" font-size="20" fill="#a33">北へまっすぐ</text>

  <!-- 南口広場 -->
  <rect x="470" y="470" width="260" height="84" rx="14" fill="#e8f0d8" stroke="#8aa35b" stroke-width="3"/>
  <text x="600" y="546" font-size="24" fill="#4d6b24" text-anchor="middle">南口広場</text>
  <!-- 3番のりば(南口広場の東側) -->
  <circle cx="756" cy="512" r="24" fill="#f2b632" stroke="#9a6d00" stroke-width="3"/>
  <text x="756" y="522" font-size="28" font-weight="700" fill="#3a2a00" text-anchor="middle">3</text>
  <text x="1010" y="500" font-size="22" font-weight="700" fill="#5a4300" text-anchor="middle">3番のりば:</text>
  <text x="1010" y="528" font-size="22" font-weight="700" fill="#5a4300" text-anchor="middle">ひだまり団地行き</text>

  <!-- ことのは公園(南西) -->
  <rect x="60" y="640" width="400" height="100" rx="20" fill="#bfe0a6" stroke="#6b9a4a" stroke-width="3"/>
  <text x="260" y="702" font-size="30" font-weight="700" fill="#2f5a1c" text-anchor="middle">ことのは公園</text>
  <text x="600" y="590" font-size="20" fill="#777" text-anchor="middle">駅前の通り</text>

  <!-- 方位 -->
  <g transform="translate(1110 110)">
    <circle r="46" fill="#fff" stroke="#777" stroke-width="3"/>
    <path d="M0 -36 L12 6 L0 -4 L-12 6 z" fill="#c0392b"/>
    <text y="34" font-size="26" font-weight="700" fill="#333" text-anchor="middle">北</text>
  </g>

  <!-- 題と断り書き -->
  <rect x="20" y="20" width="360" height="62" rx="10" fill="#fff" stroke="#cfc6ad" stroke-width="3"/>
  <text x="200" y="60" font-size="28" font-weight="700" fill="#333" text-anchor="middle">ことのは駅まわりの地図</text>
  <rect x="0" y="758" width="1200" height="42" fill="#333"/>
  <text x="600" y="787" font-size="24" fill="#fff" text-anchor="middle">架空の町「ことのは町」の地図です。実在の場所ではありません。</text>
</svg>
