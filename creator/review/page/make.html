<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>作る画面</title>
<link rel="stylesheet" href="/r/assets/make.css">
<script type="module" src="/r/assets/make.js"></script>
</head>
<body>
<main id="mk" data-phase="input">
  <p class="mk-where">この PC の Claude Code が描きます。言葉と絵は Claude が見るので、Anthropic に送られます。</p>

  <section id="input" class="mk-part">
    <form id="wordsForm" class="mk-row" autocomplete="off">
      <label class="mk-label" for="words">どんな子?(<span id="wordsMax">60</span> 字まで)</label>
      <input id="words" type="text" maxlength="120" placeholder="例: 赤い提灯の子" enterkeyhint="send" autocomplete="off">
      <p class="mk-count" id="wordsCount">0 / 60</p>
      <button type="submit" class="mk-btn primary" id="wordsBtn" aria-label="これで作る" disabled>これで作る</button>
    </form>
    <div class="mk-two">
      <label class="mk-btn" data-act="photo"><input type="file" id="photo" accept="image/*" capture="environment">写真を撮る</label>
      <label class="mk-btn" data-act="pick"><input type="file" id="pick" accept="image/*,.svg">絵を選ぶ</label>
    </div>
    <p class="mk-hint mk-formats" id="formats">使える絵: PNG・JPEG・WebP・SVG(20MB まで)</p>
    <button type="button" class="mk-btn auto" id="autoStart" aria-label="おまかせ(ぜんぶ じどう)。言葉も 絵も おすすめで きめます">おまかせ(ぜんぶ じどう)<span class="mk-sub">言葉も 絵も おすすめで きめます。あとから 直せます</span></button>
  </section>

  <section id="waiting" class="mk-part" hidden>
    <p class="mk-big">PC の Claude Code に渡しました。</p>
    <p class="mk-hint" id="waitHint">PC の Claude Code で <b>/yuru-next</b> と打つと進みます。</p>
    <p class="mk-act" id="activity" aria-live="polite"></p>
  </section>

  <section id="check" class="mk-part" hidden>
    <p class="mk-big" id="checkMsg"></p>
    <button type="button" class="mk-btn primary" id="chooseBtn"></button>
    <button type="button" class="mk-btn" id="otherBtn" aria-label="別の絵にする">別の絵にする</button>
    <button type="button" class="mk-btn auto" id="autoCheck" aria-label="おまかせ(ぜんぶ じどう)">おまかせ(ぜんぶ じどう)</button>
  </section>

  <p class="mk-drift" id="drift" role="status" hidden></p>

  <section id="c0" class="mk-part" hidden>
    <figure class="mk-fig"><img id="pic" alt="Claude が描いた絵"><figcaption id="picCap"></figcaption></figure>
    <div class="mk-brow" id="browSlot" hidden></div>
    <button type="button" class="mk-btn primary" id="okBtn" aria-label="この子にする">この子にする</button>
    <p class="mk-limit" id="limit" role="status" hidden>直しは 3 回までです。この子にするか、「やり直す(別の子にする)」を選んでね。</p>
    <form id="noteForm" class="mk-row" autocomplete="off">
      <label class="mk-label" for="note">直したい所を一言(<span id="noteMax">40</span> 字まで<span class="mk-label-more">。人の感想として渡します</span>)</label>
      <div class="mk-quick" id="quick"></div>
      <input id="note" type="text" maxlength="80" placeholder="例: 帽子を青にして" enterkeyhint="send" autocomplete="off">
      <p class="mk-count" id="noteCount">0 / 40</p>
      <button type="submit" class="mk-btn" id="noteBtn" aria-label="直したい(一言を送る)" disabled><span class="mk-long">直したい(一言を送る)</span><span class="mk-short">直したい</span></button>
    </form>
    <button type="button" class="mk-btn ghost" id="againBtn" aria-label="やり直す(別の子にする)"><span class="mk-long">やり直す(別の子にする)</span><span class="mk-short">別の子に</span></button>
    <button type="button" class="mk-btn auto" id="autoPick" aria-label="おまかせ(おすすめで きめる)">おまかせ(おすすめで きめる)</button>
  </section>

  <!-- B4(12b): 3D 用のゆるキャラ変換の絵(会話の札で形と しつかんを選んだ後に、この枠が頼んで、描けたら見せる) -->
  <section id="convert" class="mk-part" hidden>
    <p class="mk-hint">3D は、ゆるキャラの かたちに ととのえて つくるよ(もとの えと まったく おなじには ならないよ)</p>
    <p class="mk-act" id="convAct" aria-live="polite"></p>
    <figure class="mk-fig" id="convFig" hidden><img id="convPic" alt="ゆるキャラの かたちの 絵"></figure>
    <button type="button" class="mk-btn primary" id="convOk" hidden>この かたちで 3D に する</button>
    <button type="button" class="mk-btn" id="convAgain" hidden>ちがう かたちに する</button>
  </section>

  <section id="done" class="mk-part" hidden>
    <figure class="mk-fig mk-done-fig"><img id="donePic" alt="決めた子の絵"></figure>
    <p class="mk-big" id="doneMsg"></p>
    <!-- B4(12b): スマホだけで作る時の「3D にもする?」と、形・しつかんの見本(会話の画面の枠の外で開いた時だけ) -->
    <div id="phone3d" class="mk-p3" hidden><p class="mk-big" id="p3Msg"></p><div class="mk-cards" id="p3Choices"></div></div>
  </section>

  <p class="mk-err" id="err" hidden></p>
</main>
</body>
</html>
